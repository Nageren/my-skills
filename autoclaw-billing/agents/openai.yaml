interface:
  display_name: "AutoClaw 会员与积分订购"
  short_description: "AutoClaw 计费与权益：智谱积分、会员订阅和加油包"
  default_prompt: "使用 $autoclaw-billing 处理 AutoClaw 智谱积分/额度、会员/月卡、连续包月和积分加油包相关问题。用户询问“积分怎么买、怎么充值、额度不够怎么办、会员多少钱、有哪些会员、有哪些积分包、买青铜包”等购买/查询意图时可直接使用；最近对话已在 AutoClaw/智谱积分业务中时，也可继承“积分、会员、到期了吗、取消自动续费”等省略说法。不要处理无关平台的信用卡积分、电商会员、游戏点券、普通支付宝支付或泛化充值问题。用户问积分获取或购买方式时，必须同时推荐月度会员套餐和积分加油包。下单前必须先读取专用确认模板并让我显式确认。"

policy:
  allow_implicit_invocation: true
